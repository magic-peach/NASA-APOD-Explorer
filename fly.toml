# Fly.io configuration. See docs/DEPLOYMENT.md for first-time setup.
# Secrets (NASA_API_KEY, SESSION_SECRET, SOLAR_SYSTEM_API_KEY) are set with
# `fly secrets set`, never in this file.

app = "apod-explorer-magicpeach" # globally unique Fly app name
primary_region = "sin"     # Singapore, the closest Fly region to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/app.db"
  LOG_FORMAT = "json"
  # Fly's proxy sets Fly-Client-IP to the real client address; the rate
  # limiter trusts only this header (never X-Forwarded-For).
  TRUSTED_PROXY_HEADER = "Fly-Client-IP"
  # "1" serves built-in sample images instead of calling NASA. While NASA's
  # APOD API returns placeholder entries, "0" shows those placeholders (with
  # a notice in the UI); switch back to "1" for a demo with real images.
  DEMO_MODE = "0"

# SQLite lives on a persistent volume. A volume belongs to one machine, so
# this app must run exactly one machine: don't `fly scale count` above 1.
[[mounts]]
  source = "apod_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"  # sleep when idle (free-tier friendly)...
  auto_start_machines = true   # ...and wake on the next request
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
